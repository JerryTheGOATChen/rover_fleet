# controllers.yaml — diff_drive_controller + joint_state_broadcaster for the
# REAL robot. Loaded by rover_hardware.launch.py (rover_hardware package)
# against the RoverSystemHardware plugin's velocity command/state interfaces.
#
# NOT used by the simulation - rover_sim.launch.py drives the sim with
# Gazebo's native DiffDrive system plugin instead (see
# rover_control/urdf/ros2_control.xacro), which needs no controller_manager
# at all. Same wheel names/groupings and wheel_separation/wheel_radius are
# kept identical between both paths on purpose, so SLAM/Nav2 configs don't
# care which one is running underneath.

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["wheel2_joint", "wheel3_joint"]
    right_wheel_names: ["wheel1_joint", "wheel4_joint"]
    wheels_per_side: 2

    wheel_separation: 0.70
    wheel_radius: 0.15
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: body_link
    enable_odom_tf: true
    open_loop: false
    position_feedback: true

    use_stamped_vel: true
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    velocity_rolling_window_size: 10

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 1.2
    angular.z.min_velocity: -1.2
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0
