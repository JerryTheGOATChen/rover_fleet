# gz_bridge.yaml — ros_gz_bridge topic list for the sim (loaded by sim.launch.py)
#
# Each gz_type_name below is the exact type each gz-sim system publishes —
# these are not interchangeable with the "obvious" ROS-equivalent gz type,
# double check against gazebosim.org if you add more.

- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# The drive only ever sees the end of the command pipeline:
# twist_mux -> /cmd_vel_mux -> lidar_safety_node -> /cmd_vel_safe
- ros_topic_name: "cmd_vel_safe"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# JointStatePublisher publishes gz.msgs.Model (not gz.msgs.JointState — that
# type doesn't exist). The bridge knows how to convert Model -> JointState.
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
